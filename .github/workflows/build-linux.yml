name: Build – Linux

# Temporarily disabled: development is Android-only right now, and this
# workflow shares the single self-hosted runner with build-android.yml —
# every Linux push-triggered run was extra contention for the same runner
# slot that Android builds need. Re-enable by restoring the `push:` trigger
# below (kept commented so this stays a one-line revert).
on:
  # push:
  #   branches: ["**"]
  #   paths-ignore:
  #     - "**.md"
  #     - ".github/workflows/pages.yml"
  #     - ".github/workflows/runner-setup.yml"
  #     - "scripts/setup-runner.sh"
  #     - "scripts/runner-watchdog.sh"
  #     - "scripts/systemd/**"
  workflow_dispatch:

# cancel-in-progress:false — see build-android.yml for why: with :true, a
# push cadence faster than a full build livelocks the workflow (every run
# gets killed mid-build, none ever finish). GitHub only queues one run
# behind the current one regardless, so this can't pile up unbounded.
concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 120

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR }}
      PROJECT_NAME: BeachVolleyball
      OUTPUT_DIR: ${{ github.workspace }}/PackagedBuilds/Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lfs: true is a no-op today but harmless to keep: Content/Characters/
          # (Manny mesh/skeleton/anims + ABP_VolleyballPlayer) is gitignored, not
          # tracked (see .gitignore) — this checkout provides none of it. It must
          # already exist on the runner's workspace; the clean step below is what
          # actually determines whether it survives from run to run.
          lfs: true
          # The default clean runs `git clean -ffdx`, which deletes Intermediate/
          # and Binaries/ and forces a ~30 min full C++ recompile of the monolithic
          # game target on every run. We clean selectively below instead.
          clean: false

      - name: Clean workspace (keep build caches)
        run: |
          # -e Content/: Content/Characters/ (Manny mesh/skeleton/anims + the
          # authored ABP_VolleyballPlayer Anim BP) is gitignored — not tracked —
          # so without this exclude, -x here deletes it on every run even when
          # it's already sitting on the runner, and the game falls back to
          # SpawnFallbackBox() (players render as plain boxes). See VolleyballPlayer.as
          # SetupMesh() and .gitignore's Content/Characters/ comment.
          git clean -ffdx \
            -e Binaries/ \
            -e Intermediate/ \
            -e Saved/ \
            -e DerivedDataCache/ \
            -e Build/ \
            -e Content/ \
            -e "Script/Binds.Cache*"

      - name: Kill stale AutomationTool processes
        run: |
          # UAT's ProcessSingleton refuses to start a second instance and just
          # dies with "A conflicting instance of AutomationTool is already
          # running" — seen twice in a row on this runner (build-android.yml
          # run 210 attempts 1-2, 2026-08-24) against nothing else legitimately
          # building. A previous run's AutomationTool.dll process (or one of
          # the dotnet children it spawns while resolving UnrealBuildTool/
          # itself) can outlive its own job on this self-hosted runner, and
          # each doomed relaunch spawns more short-lived dotnet processes that
          # only get swept up by the runner's post-job "orphan" cleanup —
          # which runs too late to help the run that just failed. Clear the
          # decks before every Build/Package step instead of hoping the
          # previous job's cleanup already did. Same fix as build-android.yml.
          pkill -f "AutomationTool.dll" 2>/dev/null || true
          sleep 2
          pkill -9 -f "AutomationTool.dll" 2>/dev/null || true
          echo "Done (pkill exit status is not meaningful — 'no matching process' is the common/expected case)."

      - name: Resolve Unreal Engine
        shell: bash
        run: |
          for candidate in "${ENGINE_DIR:-}" "$HOME/UnrealEngine-Angelscript" "/home/erik/UnrealEngine-Angelscript" "/opt/UnrealEngine-Angelscript"; do
            if [ -n "$candidate" ] && [ -x "$candidate/Engine/Binaries/Linux/UnrealEditor" ]; then
              echo "ENGINE_DIR=$candidate" >> "$GITHUB_ENV"
              echo "UE_DERIVEDDATACACHE_ROOT=$candidate/Engine/DerivedDataCache" >> "$GITHUB_ENV"
              echo "Engine OK: $candidate"
              exit 0
            fi
          done
          echo "ERROR: UnrealEditor was not found; set repository variable ENGINE_DIR."
          exit 1

      - name: Build C++ module
        run: |
          "$ENGINE_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            ${PROJECT_NAME}Editor Linux Development \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -progress

      - name: Package for Linux
        run: |
          mkdir -p "$OUTPUT_DIR"
          "$ENGINE_DIR/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -noP4 \
            -platform=Linux \
            -clientconfig=Development \
            -cook -build -stage -pak -archive \
            -nozenstore \
            -nodebuginfo \
            -archivedirectory="$OUTPUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.sha }}
          path: PackagedBuilds/Linux/
          retention-days: 14
