name: Build – Web (HTML5)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 180

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR || '/opt/UnrealEngine-Angelscript' }}
      PROJECT_NAME: BeachVolleyball
      OUTPUT_DIR: ${{ github.workspace }}/PackagedBuilds/Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure HTML5 platform + Emscripten
        run: |
          test -x "$ENGINE_DIR/Engine/Binaries/Linux/UnrealEditor" || {
            echo "ERROR: engine not found at $ENGINE_DIR"; exit 1
          }

          # 1. Community HTML5 platform plugin (UE5 has no official HTML5 support)
          HTML5_DIR="$ENGINE_DIR/Engine/Platforms/HTML5"
          if [ ! -d "$HTML5_DIR" ]; then
            echo ">> Installing community HTML5 platform plugin..."
            git clone --depth 1 \
              https://github.com/nicktindall/ue5-html5-plugin.git "$HTML5_DIR"
          fi

          # 2. Emscripten SDK — required to compile the engine/game to WASM
          EMSDK_DIR="${EMSDK_DIR:-$HOME/emsdk}"
          if [ ! -d "$EMSDK_DIR/.git" ]; then
            echo ">> Installing Emscripten SDK..."
            git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          fi
          ( cd "$EMSDK_DIR" && ./emsdk install latest && ./emsdk activate latest )

          # Export emsdk env (EMSDK, EM_CONFIG, PATH additions) to later steps
          # shellcheck disable=SC1091
          source "$EMSDK_DIR/emsdk_env.sh"
          {
            echo "EMSDK=$EMSDK"
            echo "EM_CONFIG=$EM_CONFIG"
            echo "PATH=$PATH"
          } >> "$GITHUB_ENV"

          # 3. Regenerate project files so UBT discovers the new platform
          ( cd "$ENGINE_DIR" && ./GenerateProjectFiles.sh ) || true
          echo "HTML5 platform + Emscripten ready"

      - name: Build C++ module (HTML5)
        run: |
          "$ENGINE_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            ${PROJECT_NAME} HTML5 Development \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -progress

      - name: Package for HTML5
        run: |
          mkdir -p "$OUTPUT_DIR"
          "$ENGINE_DIR/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -noP4 \
            -platform=HTML5 \
            -clientconfig=Development \
            -cook -build -stage -pak -archive \
            -nozenstore \
            -archivedirectory="$OUTPUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: PackagedBuilds/Web/
          retention-days: 14
