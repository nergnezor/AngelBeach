name: Deploy – GitHub Pages

# Builds a small static landing page that links to the latest build artifacts
# (Linux + Android). No game build happens here — web/HTML5 packaging is not
# supported by the Angelscript engine fork, so there is nothing to embed.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Generate the landing page ──────────────────────────────────────────
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Generate site
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          OUTPUT_DIR="${{ github.workspace }}/site"
          mkdir -p "$OUTPUT_DIR"
          SHORT_SHA="${SHA:0:7}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          ACTIONS_URL="https://github.com/$REPO/actions"

          cat > "$OUTPUT_DIR/index.html" << HTMLEOF
          <!DOCTYPE html>
          <html lang="sv">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Angel Beach – Byggportal</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: system-ui, sans-serif;
                background: #0d1117;
                color: #e6edf3;
                min-height: 100vh;
              }
              header {
                background: #161b22;
                border-bottom: 1px solid #30363d;
                padding: 1.25rem 2rem;
                display: flex;
                align-items: center;
                gap: 1rem;
              }
              header h1 { font-size: 1.4rem; color: #58a6ff; }
              header .meta { font-size: .85rem; color: #8b949e; margin-left: auto; }
              header .meta a { color: #58a6ff; text-decoration: none; }
              header .meta a:hover { text-decoration: underline; }
              main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1.5rem;
              }
              .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #f0f6fc; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
              .dl-btn {
                display: flex;
                align-items: center;
                gap: .75rem;
                padding: .85rem 1.25rem;
                background: #21262d;
                border: 1px solid #30363d;
                border-radius: 6px;
                color: #e6edf3;
                text-decoration: none;
                font-size: .95rem;
                transition: border-color .15s, background .15s;
              }
              .dl-btn:hover { background: #292f38; border-color: #58a6ff; }
              .dl-btn .icon { font-size: 1.4rem; }
              .dl-btn .label { line-height: 1.3; }
              .dl-btn .sub { font-size: .78rem; color: #8b949e; }
              .commit { font-family: monospace; background: #21262d; padding: .1rem .4rem; border-radius: 4px; font-size: .9em; }
              .note { font-size: .85rem; color: #8b949e; line-height: 1.5; }
              footer { text-align: center; padding: 2rem; font-size: .8rem; color: #484f58; }
            </style>
          </head>
          <body>
            <header>
              <span style="font-size:1.8rem">🏐</span>
              <h1>Angel Beach</h1>
              <div class="meta">
                Branch: <strong>$REF</strong> &nbsp;·&nbsp;
                Commit: <span class="commit">$SHORT_SHA</span> &nbsp;·&nbsp;
                $BUILD_DATE &nbsp;·&nbsp;
                <a href="$ACTIONS_URL">GitHub Actions &rarr;</a>
              </div>
            </header>

            <main>
              <div class="card">
                <h2>Ladda ned senaste bygget</h2>
                <p class="note" style="margin-bottom:1rem">
                  Öppna senaste lyckade körningen och hämta artefakten längst ned på sidan.
                </p>
                <div class="grid">
                  <a class="dl-btn" href="$ACTIONS_URL/workflows/build-linux.yml">
                    <span class="icon">🐧</span>
                    <span class="label">
                      Linux
                      <br><span class="sub">build-linux → artifacts</span>
                    </span>
                  </a>
                  <a class="dl-btn" href="$ACTIONS_URL/workflows/build-android.yml">
                    <span class="icon">🤖</span>
                    <span class="label">
                      Android
                      <br><span class="sub">build-android → artifacts</span>
                    </span>
                  </a>
                </div>
              </div>

              <div class="card">
                <h2>Bygg&shy;information</h2>
                <table style="border-collapse:collapse;width:100%;font-size:.9rem">
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e;width:130px">Repo</td><td><a href="https://github.com/$REPO" style="color:#58a6ff">$REPO</a></td></tr>
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e">Branch</td><td>$REF</td></tr>
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e">Commit</td><td><a href="https://github.com/$REPO/commit/$SHA" style="color:#58a6ff"><span class="commit">$SHA</span></a></td></tr>
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e">Sidan byggd</td><td>$BUILD_DATE</td></tr>
                </table>
              </div>
            </main>

            <footer>Automatiskt byggt med GitHub Actions &middot; Angel Beach</footer>
          </body>
          </html>
          HTMLEOF

          echo "Site generated at $OUTPUT_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ── 2. Deploy to GitHub Pages ─────────────────────────────────────────────
  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
