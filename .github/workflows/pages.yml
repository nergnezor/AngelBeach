name: Deploy – GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Build the HTML5 package ────────────────────────────────────────────
  build-web:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 180

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR || '/opt/UnrealEngine-Angelscript' }}
      PROJECT_NAME: BeachVolleyball
      OUTPUT_DIR: ${{ github.workspace }}/PackagedBuilds/Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify engine & HTML5 platform
        run: |
          test -x "$ENGINE_DIR/Engine/Binaries/Linux/UnrealEditor" || {
            echo "ERROR: engine not found at $ENGINE_DIR"; exit 1
          }
          test -d "$ENGINE_DIR/Engine/Platforms/HTML5" || {
            echo "ERROR: HTML5 platform not found — install the community plugin."
            exit 1
          }

      - name: Build C++ module (HTML5)
        run: |
          "$ENGINE_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            ${PROJECT_NAME} HTML5 Development \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -progress

      - name: Package for HTML5
        run: |
          mkdir -p "$OUTPUT_DIR"
          "$ENGINE_DIR/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -noP4 \
            -platform=HTML5 \
            -clientconfig=Development \
            -cook -build -stage -pak -archive \
            -archivedirectory="$OUTPUT_DIR"

      - name: Generate site
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          GAME_DIR="$OUTPUT_DIR/HTML5"
          SHORT_SHA="${SHA:0:7}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          ACTIONS_URL="https://github.com/$REPO/actions/runs/$RUN_ID"

          # Landing page at site root
          cat > "$OUTPUT_DIR/index.html" << HTMLEOF
          <!DOCTYPE html>
          <html lang="sv">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Angel Beach – Byggramport</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: system-ui, sans-serif;
                background: #0d1117;
                color: #e6edf3;
                min-height: 100vh;
              }
              header {
                background: #161b22;
                border-bottom: 1px solid #30363d;
                padding: 1.25rem 2rem;
                display: flex;
                align-items: center;
                gap: 1rem;
              }
              header h1 { font-size: 1.4rem; color: #58a6ff; }
              header .meta { font-size: .85rem; color: #8b949e; margin-left: auto; }
              header .meta a { color: #58a6ff; text-decoration: none; }
              header .meta a:hover { text-decoration: underline; }
              main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1.5rem;
              }
              .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #f0f6fc; }
              .game-frame {
                width: 100%;
                aspect-ratio: 16/9;
                border: none;
                border-radius: 6px;
                background: #000;
                display: block;
              }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
              .dl-btn {
                display: flex;
                align-items: center;
                gap: .75rem;
                padding: .85rem 1.25rem;
                background: #21262d;
                border: 1px solid #30363d;
                border-radius: 6px;
                color: #e6edf3;
                text-decoration: none;
                font-size: .95rem;
                transition: border-color .15s, background .15s;
              }
              .dl-btn:hover { background: #292f38; border-color: #58a6ff; }
              .dl-btn .icon { font-size: 1.4rem; }
              .dl-btn .label { line-height: 1.3; }
              .dl-btn .sub { font-size: .78rem; color: #8b949e; }
              .badge {
                display: inline-block;
                padding: .2rem .65rem;
                border-radius: 2rem;
                font-size: .75rem;
                font-weight: 600;
                background: #1f6feb33;
                color: #58a6ff;
                border: 1px solid #1f6feb66;
                margin-left: .5rem;
                vertical-align: middle;
              }
              .commit { font-family: monospace; background: #21262d; padding: .1rem .4rem; border-radius: 4px; font-size: .9em; }
              footer { text-align: center; padding: 2rem; font-size: .8rem; color: #484f58; }
            </style>
          </head>
          <body>
            <header>
              <span style="font-size:1.8rem">🏐</span>
              <h1>Angel Beach</h1>
              <div class="meta">
                Branch: <strong>$REF</strong> &nbsp;·&nbsp;
                Commit: <span class="commit">$SHORT_SHA</span> &nbsp;·&nbsp;
                $BUILD_DATE &nbsp;·&nbsp;
                <a href="$ACTIONS_URL">GitHub Actions &rarr;</a>
              </div>
            </header>

            <main>
              <div class="card">
                <h2>Spela i webbläsaren <span class="badge">HTML5</span></h2>
                <iframe
                  class="game-frame"
                  src="HTML5/BeachVolleyball.html"
                  allowfullscreen
                  sandbox="allow-scripts allow-same-origin"
                ></iframe>
              </div>

              <div class="card">
                <h2>Ladda ned</h2>
                <div class="grid">
                  <a class="dl-btn" href="$ACTIONS_URL#artifacts">
                    <span class="icon">🐧</span>
                    <span class="label">
                      Linux
                      <br><span class="sub">linux-$SHORT_SHA</span>
                    </span>
                  </a>
                  <a class="dl-btn" href="$ACTIONS_URL#artifacts">
                    <span class="icon">🤖</span>
                    <span class="label">
                      Android
                      <br><span class="sub">android-$SHORT_SHA</span>
                    </span>
                  </a>
                  <a class="dl-btn" href="$ACTIONS_URL#artifacts">
                    <span class="icon">🌐</span>
                    <span class="label">
                      Webb (HTML5)
                      <br><span class="sub">web-$SHORT_SHA</span>
                    </span>
                  </a>
                </div>
              </div>

              <div class="card">
                <h2>Bygg&shy;information</h2>
                <table style="border-collapse:collapse;width:100%;font-size:.9rem">
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e;width:130px">Repo</td><td><a href="https://github.com/$REPO" style="color:#58a6ff">$REPO</a></td></tr>
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e">Branch</td><td>$REF</td></tr>
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e">Commit</td><td><a href="https://github.com/$REPO/commit/$SHA" style="color:#58a6ff"><span class="commit">$SHA</span></a></td></tr>
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e">Byggt</td><td>$BUILD_DATE</td></tr>
                  <tr><td style="padding:.4rem 1rem .4rem 0;color:#8b949e">Körning</td><td><a href="$ACTIONS_URL" style="color:#58a6ff">#$RUN_ID</a></td></tr>
                </table>
              </div>
            </main>

            <footer>Automatiskt byggt med GitHub Actions &middot; Angel Beach</footer>
          </body>
          </html>
          HTMLEOF

          echo "Site generated at $OUTPUT_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: PackagedBuilds/Web/

  # ── 2. Deploy to GitHub Pages ─────────────────────────────────────────────
  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
