name: LFS Diagnose

# Throwaway diagnostic job: the Linux/Android runners report a successful
# `actions/checkout@v4` + lfs:true in ~7s but leave Content/Characters/**
# as LFS pointer text instead of the real binaries, even though the
# objects are confirmed present and healthy on GitHub's LFS storage (a
# plain `git clone` elsewhere pulls them fine). That points at something
# in this runner's persistent environment (workspace/git config survive
# between jobs on self-hosted runners) silently skipping the smudge —
# most likely GIT_LFS_SKIP_SMUDGE set somewhere, or a stale
# `git lfs install --skip-smudge`. This job dumps enough state to tell
# which. Delete once diagnosed.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 5

    steps:
      - name: Checkout (with lfs)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Dump LFS environment
        shell: bash
        run: |
          echo "== whoami / host =="
          whoami
          hostname
          echo

          echo "== git lfs version =="
          git lfs version || echo "git-lfs NOT FOUND on PATH"
          echo

          echo "== git lfs env =="
          git lfs env || true
          echo

          echo "== LFS-related env vars in this job =="
          env | grep -i LFS || echo "(none set)"
          echo

          echo "== local (repo) git config =="
          git config --local --list | grep -i lfs || echo "(none)"
          echo

          echo "== global (runner user) git config =="
          git config --global --list 2>/dev/null | grep -i lfs || echo "(none)"
          echo

          echo "== system git config =="
          git config --system --list 2>/dev/null | grep -i lfs || echo "(none)"
          echo

          echo "== is smudge actually pointer text right now? =="
          SAMPLE=$(find Content/Characters -type f -name '*.uasset' 2>/dev/null | head -n1)
          if [ -z "$SAMPLE" ]; then
            echo "No .uasset files found under Content/Characters"
          else
            echo "Sample file: $SAMPLE"
            ls -lh "$SAMPLE"
            echo "--- first 200 bytes ---"
            head -c 200 "$SAMPLE"
            echo
          fi
          echo

          echo "== git lfs ls-files (first 20) =="
          git lfs ls-files | head -n 20 || true

      - name: Explicit git lfs pull with smudge forced on + tracing
        shell: bash
        run: |
          GIT_TRACE=1 GIT_LFS_SKIP_SMUDGE=0 git lfs pull -I "Content/Characters/**" 2>&1 | tail -n 150

      - name: Re-check sample file after explicit pull
        shell: bash
        run: |
          SAMPLE=$(find Content/Characters -type f -name '*.uasset' 2>/dev/null | head -n1)
          if [ -n "$SAMPLE" ]; then
            ls -lh "$SAMPLE"
            head -c 200 "$SAMPLE"
            echo
          else
            echo "No .uasset files found under Content/Characters"
          fi
