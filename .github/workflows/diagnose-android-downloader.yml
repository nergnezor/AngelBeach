name: Diagnose – Android OBB Downloader

# One-off, read-only diagnostic: greps the engine source on the runner to find
# what governs generation of DownloaderActivity/OBBDownloaderService, so we
# can fix the Play Console "Billing AIDL" flag with a real answer instead of
# guessing. Safe to leave in the repo (workflow_dispatch only, no side effects,
# no secrets used) — delete once the investigation is done.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 10

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR }}

    steps:
      - name: Resolve Unreal Engine
        shell: bash
        run: |
          for candidate in "${ENGINE_DIR:-}" "$HOME/UnrealEngine-Angelscript" "/home/erik/UnrealEngine-Angelscript" "/opt/UnrealEngine-Angelscript"; do
            if [ -n "$candidate" ] && [ -x "$candidate/Engine/Binaries/Linux/UnrealEditor" ]; then
              echo "ENGINE_DIR=$candidate" >> "$GITHUB_ENV"
              echo "Engine OK: $candidate"
              exit 0
            fi
          done
          echo "ERROR: UnrealEditor was not found; set repository variable ENGINE_DIR."
          exit 1

      - name: Grep Android deploy source for Downloader/OBB conditions
        run: |
          UBT_ANDROID="$ENGINE_DIR/Engine/Source/Programs/UnrealBuildTool/Platform/Android"
          test -d "$UBT_ANDROID" || { echo "ERROR: $UBT_ANDROID not found"; exit 1; }

          echo "############ 1. Files mentioning OBBDownloaderService/DownloaderActivity ############"
          grep -rln "OBBDownloaderService\|DownloaderActivity" "$UBT_ANDROID" || echo "(no matches)"

          echo ""
          echo "############ 2. Context around DownloaderActivity.java generation (30 lines before) ############"
          grep -rn -B30 "DownloaderActivity.java" "$UBT_ANDROID" | head -120 || echo "(no matches)"

          echo ""
          echo "############ 3. All bPackageDataInsideApk references in Android deploy code ############"
          grep -rn -B3 -A3 "bPackageDataInsideApk" "$UBT_ANDROID" | head -200 || echo "(no matches)"

          echo ""
          echo "############ 4. Any explicit downloader/OBB disable toggle ############"
          grep -rniE "bDisableDownloader|bSkipDownloader|bUseObbInAPK|bNoOBBFile|GenerateOBBData|bGenerateOBB" "$UBT_ANDROID" | head -80 || echo "(no matches)"

          echo ""
          echo "############ 5. Where AndroidManifest gets the DownloaderActivity/OBBDownloaderService entries added ############"
          grep -rn -B10 -A2 "\.DownloaderActivity\|\.OBBDownloaderService" "$UBT_ANDROID" | grep -i "manifest\|activity\|service" -A2 -B10 | head -150 || echo "(no matches)"

          echo ""
          echo "############ 6. Every raw occurrence of '.OBBDownloaderService' with generous context ############"
          echo "############    (the <activity> entry is now guarded; <service> entry — if separate — is not) ############"
          grep -n "\.OBBDownloaderService" "$UBT_ANDROID/UEDeployAndroid.cs" | while IFS=: read -r lineno rest; do
            echo "--- match at line $lineno ---"
            sed -n "$((lineno>15 ? lineno-15 : 1)),$((lineno+5))p" "$UBT_ANDROID/UEDeployAndroid.cs"
            echo ""
          done
