name: Build – Android

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 180

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR || '/opt/UnrealEngine-Angelscript' }}
      PROJECT_NAME: BeachVolleyball
      OUTPUT_DIR: ${{ github.workspace }}/PackagedBuilds/Android
      # Android SDK/NDK paths — set these as repository variables or override below.
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}
      ANDROID_NDK_HOME: ${{ vars.ANDROID_NDK_HOME || '/opt/android-ndk' }}
      JAVA_HOME: ${{ vars.JAVA_HOME || '/usr/lib/jvm/java-17-openjdk-amd64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify engine
        run: |
          test -x "$ENGINE_DIR/Engine/Binaries/Linux/UnrealEditor" || {
            echo "ERROR: engine not found at $ENGINE_DIR"
            exit 1
          }
          echo "Engine OK: $ENGINE_DIR"

      - name: Verify Android SDK/NDK
        run: |
          test -d "$ANDROID_HOME" || { echo "ERROR: ANDROID_HOME not found: $ANDROID_HOME"; exit 1; }
          test -d "$ANDROID_NDK_HOME" || { echo "ERROR: ANDROID_NDK_HOME not found: $ANDROID_NDK_HOME"; exit 1; }
          echo "Android SDK : $ANDROID_HOME"
          echo "Android NDK : $ANDROID_NDK_HOME"

      - name: Build C++ module (Android)
        run: |
          "$ENGINE_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            ${PROJECT_NAME} Android Development \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -progress

      - name: Package for Android (APK)
        run: |
          mkdir -p "$OUTPUT_DIR"
          "$ENGINE_DIR/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -noP4 \
            -platform=Android \
            -cookflavor=Multi \
            -clientconfig=Development \
            -cook -build -stage -pak -archive \
            -nozenstore \
            -archivedirectory="$OUTPUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: PackagedBuilds/Android/
          retention-days: 14
