name: Build – Android

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/runner-setup.yml"
      - "scripts/setup-runner.sh"
      - "scripts/runner-watchdog.sh"
      - "scripts/systemd/**"
  workflow_dispatch:

# One runner serves all jobs. cancel-in-progress:true livelocked this
# workflow once pushes to main landed faster than a full Package step
# (~15-40 min): every run got killed mid-cook before ever finishing, so
# no build ever completed (see run history around 2026-07-30). With
# cancel-in-progress:false, GitHub only ever holds ONE run queued behind
# the current one — a burst of pushes does not pile up an unbounded
# backlog, it just guarantees the currently running build finishes, then
# the next run picks up whatever is latest at that point.
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 180

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR }}
      PROJECT_NAME: BeachVolleyball
      OUTPUT_DIR: ${{ github.workspace }}/PackagedBuilds/Android
      # Must match Config/DefaultEngine.ini [/Script/AndroidRuntimeSettings...] PackageName
      # and the app's package name in Play Console.
      PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.angelbeach.beachvolleyball' }}
      # Android SDK root — set as a repository variable or override below.
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}
      JAVA_HOME: ${{ vars.JAVA_HOME || '/usr/lib/jvm/java-17-openjdk-amd64' }}
      # NDK version the engine requires. UnrealBuildTool rejects any other
      # version with "Sdk: not found. Required version rXXx". Bump this if the
      # engine's required NDK changes (see Engine AndroidPlatformSDK).
      NDK_VERSION: "27.2.12479018"   # r27c

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Content/Characters/ (Manny mesh/skeleton/anims) is tracked via Git LFS —
          # without lfs: true, checkout only pulls the small pointer files, and cook
          # sees corrupt/unreadable .uasset files instead of the real binary content.
          lfs: true
          # The default clean runs `git clean -ffdx`, which deletes Intermediate/
          # and Binaries/ and forces a ~20 min full C++ recompile of the Android
          # client on every run. We clean selectively below instead.
          clean: false

      - name: Clean workspace (keep build caches)
        run: |
          git clean -ffdx \
            -e Binaries/ \
            -e Intermediate/ \
            -e Saved/ \
            -e DerivedDataCache/ \
            -e Build/ \
            -e "Script/Binds.Cache*"

      - name: Resolve Unreal Engine
        shell: bash
        run: |
          for candidate in "${ENGINE_DIR:-}" "$HOME/UnrealEngine-Angelscript" "/home/erik/UnrealEngine-Angelscript" "/opt/UnrealEngine-Angelscript"; do
            if [ -n "$candidate" ] && [ -x "$candidate/Engine/Binaries/Linux/UnrealEditor" ]; then
              echo "ENGINE_DIR=$candidate" >> "$GITHUB_ENV"
              # Persists shader/texture derived-data across runs on this same
              # runner instead of recompiling it every build (build-linux.yml
              # already did this; Android was missing it).
              echo "UE_DERIVEDDATACACHE_ROOT=$candidate/Engine/DerivedDataCache" >> "$GITHUB_ENV"
              echo "Engine OK: $candidate"
              exit 0
            fi
          done
          echo "ERROR: UnrealEditor was not found; set repository variable ENGINE_DIR."
          exit 1

      - name: Ensure engine-required Android NDK (r27c)
        run: |
          test -d "$ANDROID_HOME" || { echo "ERROR: ANDROID_HOME not found: $ANDROID_HOME"; exit 1; }

          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          PLATFORM35_DIR="$ANDROID_HOME/platforms/android-35"
          BUILDTOOLS35_DIR="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -d "$NDK_DIR" ] || [ ! -d "$PLATFORM35_DIR" ] || [ ! -d "$BUILDTOOLS35_DIR" ]; then
            echo ">> Missing NDK $NDK_VERSION and/or platform 35 / build-tools 35.0.0; installing via sdkmanager..."
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
            test -n "$SDKMANAGER" || {
              echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools/latest/bin"
              echo "       Install the Android command-line tools on the runner."
              exit 1
            }
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            # NDK plus the SDK bits gradle needs to assemble the APK.
            # Play now requires targetSdkVersion 35; keep 34 installed too since
            # some engine tooling still references it.
            "$SDKMANAGER" "ndk;$NDK_VERSION" \
              "platform-tools" "platforms;android-35" "platforms;android-34" \
              "build-tools;35.0.0" "build-tools;34.0.0"
          fi
          test -d "$NDK_DIR" || { echo "ERROR: NDK still missing at $NDK_DIR"; exit 1; }
          test -d "$PLATFORM35_DIR" || { echo "ERROR: platforms;android-35 still missing"; exit 1; }
          test -d "$BUILDTOOLS35_DIR" || { echo "ERROR: build-tools;35.0.0 still missing"; exit 1; }

          # UnrealBuildTool reads the NDK location from NDKROOT / ANDROID_NDK_ROOT
          # (NOT ANDROID_NDK_HOME). Export all three for subsequent steps.
          {
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_ROOT=$NDK_DIR"
            echo "NDKROOT=$NDK_DIR"
          } >> "$GITHUB_ENV"
          echo "Android SDK : $ANDROID_HOME"
          echo "Android NDK : $NDK_DIR"

      - name: Ensure Zen storage server is running
        run: |
          # Zen normally auto-launches scoped to the Cook subprocess's PID and dies the
          # instant Cook exits, which breaks the following Stage step (Connection refused).
          # Run it as a detached, session-independent daemon so it survives across steps
          # and jobs. No-op if a healthy instance is already up.
          if curl -sf http://localhost:8558/health/ready > /dev/null 2>&1; then
            echo "Zen already running and healthy."
          else
            echo "Starting standalone Zen server..."
            setsid nohup "$ENGINE_DIR/Engine/Binaries/Linux/zenserver" \
              --port 8558 \
              --data-dir "$HOME/.config/Epic/UnrealEngine/Common/Zen/Data" \
              --http asio \
              --gc-cache-duration-seconds 1209600 \
              --gc-interval-seconds 21600 \
              --gc-low-diskspace-threshold 2147483648 \
              --cache-bucket-limit-overwrites \
              --quiet \
              > /tmp/zenserver-standalone.log 2>&1 < /dev/null &
            disown
            for i in $(seq 1 30); do
              curl -sf http://localhost:8558/health/ready > /dev/null 2>&1 && break
              sleep 1
            done
            curl -sf http://localhost:8558/health/ready > /dev/null 2>&1 || {
              echo "ERROR: Zen server failed to start"; cat /tmp/zenserver-standalone.log; exit 1
            }
            echo "Zen server started."
          fi

      # NOTE: no separate Build.sh step here. Packaging below passes -build with
      # -clientconfig=Development, so UAT compiles the exact binaries it stages;
      # a separate Shipping pre-build spent ~17 min producing a .so that was
      # never packaged.

      - name: Prepare Android signing (from secrets)
        run: |
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            eval "val=\${$s}"
            test -n "$val" || { echo "ERROR: secret $s is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          done

          mkdir -p "$GITHUB_WORKSPACE/Build/Android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/Build/Android/release.keystore"

          # UE layers Config/Android/AndroidEngine.ini on top of DefaultEngine.ini for
          # Android builds. This file is tracked in git (it also carries the mobile
          # SkyAtmosphere override from c4b3094) — APPEND the signing block instead
          # of overwriting, or every CI build silently drops that override and ships
          # the desktop atmosphere config on mobile (no dedicated sky mesh there).
          mkdir -p "$GITHUB_WORKSPACE/Config/Android"
          cat >> "$GITHUB_WORKSPACE/Config/Android/AndroidEngine.ini" << EOF

          [/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
          KeyStore=release.keystore
          KeyAlias=$ANDROID_KEY_ALIAS
          KeyStorePassword=$ANDROID_KEYSTORE_PASSWORD
          KeyPassword=$ANDROID_KEY_PASSWORD
          ; Play requires versionCode to strictly increase on every upload.
          StoreVersion=$GITHUB_RUN_NUMBER
          EOF
          echo "Signing config + StoreVersion=$GITHUB_RUN_NUMBER prepared."
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Package for Android (APK + AAB)
        run: |
          # EXPERIMENTAL (2026-08): trying iterative cooking for build speed on this
          # single-runner setup. Saved/Cooked/Android* now survives between runs so
          # -iterativecooking below can skip re-cooking unchanged assets. This is a
          # known risk area: AngelScript sources aren't fully tracked in UE's cook
          # dependency graph, so a script that references a *new* asset without any
          # .uasset itself changing could leave that asset uncooked — the same
          # failure class as the earlier "boxes instead of robots" bug. If content
          # ever goes missing/wrong on-device after a script change, wipe
          # Saved/Cooked/Android* once (or drop -iterativecooking) to force a clean
          # full cook, and consider reverting this.
          #
          # Staged output and the archive dir are NOT cook cache — always safe (and
          # necessary) to wipe so stale scripts can't combine with old staged data.
          rm -rf "$GITHUB_WORKSPACE"/Saved/StagedBuilds/Android* \
                 "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          # APK size choices:
          #  -cookflavor=ASTC   one texture format instead of Multi (DXT+ETC2+ASTC
          #                     all packed into the same .ucas); ASTC covers every
          #                     Vulkan/GLES3.2-era device (~2016+)
          #  -clientconfig=Shipping  Development libUnreal.so was 271 MB and pulled
          #                     in the 24 MB Vulkan validation layer + profiling
          #                     libs; note Shipping has no UE_LOG in adb logcat
          #  -compressed        Oodle-compress cooked content; the embedded OBB is
          #                     stored uncompressed in the APK (UE names it .png
          #                     precisely so the APK zip won't touch it), so without
          #                     this the full cooked size hits the APK 1:1
          #  -distribution      Without this, Gradle's "release" build type gets no
          #                     signingConfig at all — our KeyStore/KeyAlias/
          #                     *Password (Config/Android/AndroidEngine.ini, set up
          #                     above) are silently ignored and the .aab comes out
          #                     genuinely unsigned. That's the literal cause of
          #                     Play Console's "Alla uppladdade paket måste
          #                     signeras" on upload — not a wrong-key mismatch, but
          #                     zero signature.
          "$ENGINE_DIR/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -noP4 \
            -platform=Android \
            -cookflavor=ASTC \
            -clientconfig=Shipping \
            -distribution \
            -cook -iterativecooking -build -stage -pak -package -archive \
            -compressed \
            -nozenstore \
            -nodebuginfo \
            -archivedirectory="$OUTPUT_DIR"

      - name: Collect APK + AAB
        run: |
          APK_DIR="$GITHUB_WORKSPACE/Artifacts/apk"
          AAB_DIR="$GITHUB_WORKSPACE/Artifacts/aab"
          mkdir -p "$APK_DIR" "$AAB_DIR"
          found_apk=0
          found_aab=0
          # Only the universal APK is self-contained (content embedded via
          # bPackageDataInsideApk). Shipping packaging also emits a content-less
          # arm64 APK and an AFS companion APK — neither is installable on its
          # own, so don't ship them in the artifact.
          while IFS= read -r f; do
            echo "Found APK: $f"; cp -f "$f" "$APK_DIR/"; found_apk=1
          done < <(find "$OUTPUT_DIR" "$GITHUB_WORKSPACE/Saved/StagedBuilds/Android" \
                     -name '*_universal.apk' 2>/dev/null)
          while IFS= read -r f; do
            echo "Found AAB: $f"; cp -f "$f" "$AAB_DIR/"; found_aab=1
          done < <(find "$OUTPUT_DIR" "$GITHUB_WORKSPACE/Saved/StagedBuilds/Android" \
                     -name '*.aab' 2>/dev/null)
          if [ "$found_apk" = "0" ]; then
            echo "ERROR: packaging produced no .apk"; exit 1
          fi
          if [ "$found_aab" = "0" ]; then
            echo "WARNING: packaging produced no .aab (bEnableBundle may need adjusting) — Play upload step will be skipped."
          fi
          ls -lh "$APK_DIR" "$AAB_DIR" 2>/dev/null

      # The APK as its own dedicated artifact (for direct sideload installs).
      # APKs are already zip-compressed — recompressing wastes time for ~0 gain.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: Artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # The AAB as its own artifact (for Play Console upload).
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: Artifacts/aab/*.aab
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  # ── Play Internal Testing ──────────────────────────────────────────────────
  # Only on main/master: a broken experimental branch shouldn't push a bad
  # build to testers' phones. Play auto-updates the Play Store app on any
  # device that has opted into the internal test — no cable, no manual APK.
  publish-play-internal:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 15

    env:
      PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.angelbeach.beachvolleyball' }}

    steps:
      - name: Checkout (for the upload script)
        uses: actions/checkout@v4
        with:
          # This job runs on the same runner and shares the build job's workspace.
          # The default clean (git clean -ffdx) would wipe the Intermediate/ and
          # Binaries/ caches the build job just left behind — and the freshly
          # collected Artifacts/aab/ we upload from below.
          clean: false

      - name: Write service account key
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "ERROR: secret PLAY_SERVICE_ACCOUNT_JSON is not set."
            echo "       Play Console → Setup → API access → service account JSON."
            exit 1
          }
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Install uploader dependencies
        run: pip install --quiet --user google-api-python-client google-auth

      - name: Upload to Play internal testing track
        run: |
          # Single-runner setup: the build job wrote Artifacts/aab/ into this same
          # workspace, so use it directly instead of round-tripping the AAB through
          # GitHub artifact storage. If a second runner machine is ever added, this
          # needs a download-artifact step (name: android-aab-<sha>) again.
          AAB=$(find "$GITHUB_WORKSPACE/Artifacts/aab" -name '*.aab' 2>/dev/null | head -1)
          test -n "$AAB" || { echo "ERROR: no .aab found in workspace (built on another machine?)"; exit 1; }
          python3 scripts/upload_play_internal.py \
            --package "$PACKAGE_NAME" \
            --aab "$AAB" \
            --service-account-json "$RUNNER_TEMP/play-service-account.json" \
            --track internal \
            --release-notes "CI build ${{ github.sha }}"

      - name: Clean up service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
