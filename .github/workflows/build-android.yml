name: Build – Android

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 180

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR }}
      PROJECT_NAME: BeachVolleyball
      OUTPUT_DIR: ${{ github.workspace }}/PackagedBuilds/Android
      # Must match Config/DefaultEngine.ini [/Script/AndroidRuntimeSettings...] PackageName
      # and the app's package name in Play Console.
      PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.angelbeach.beachvolleyball' }}
      # Android SDK root — set as a repository variable or override below.
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}
      JAVA_HOME: ${{ vars.JAVA_HOME || '/usr/lib/jvm/java-17-openjdk-amd64' }}
      # NDK version the engine requires. UnrealBuildTool rejects any other
      # version with "Sdk: not found. Required version rXXx". Bump this if the
      # engine's required NDK changes (see Engine AndroidPlatformSDK).
      NDK_VERSION: "27.2.12479018"   # r27c

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Content/Characters/ (Manny mesh/skeleton/anims) is tracked via Git LFS —
          # without lfs: true, checkout only pulls the small pointer files, and cook
          # sees corrupt/unreadable .uasset files instead of the real binary content.
          lfs: true

      - name: Resolve Unreal Engine
        shell: bash
        run: |
          for candidate in "${ENGINE_DIR:-}" "$HOME/UnrealEngine-Angelscript" "/home/erik/UnrealEngine-Angelscript" "/opt/UnrealEngine-Angelscript"; do
            if [ -n "$candidate" ] && [ -x "$candidate/Engine/Binaries/Linux/UnrealEditor" ]; then
              echo "ENGINE_DIR=$candidate" >> "$GITHUB_ENV"
              echo "Engine OK: $candidate"
              exit 0
            fi
          done
          echo "ERROR: UnrealEditor was not found; set repository variable ENGINE_DIR."
          exit 1

      - name: Ensure engine-required Android NDK (r27c)
        run: |
          test -d "$ANDROID_HOME" || { echo "ERROR: ANDROID_HOME not found: $ANDROID_HOME"; exit 1; }

          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo ">> NDK $NDK_VERSION not installed; installing via sdkmanager..."
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
            test -n "$SDKMANAGER" || {
              echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools/latest/bin"
              echo "       Install the Android command-line tools on the runner."
              exit 1
            }
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            # NDK plus the SDK bits gradle needs to assemble the APK.
            "$SDKMANAGER" "ndk;$NDK_VERSION" \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          test -d "$NDK_DIR" || { echo "ERROR: NDK still missing at $NDK_DIR"; exit 1; }

          # UnrealBuildTool reads the NDK location from NDKROOT / ANDROID_NDK_ROOT
          # (NOT ANDROID_NDK_HOME). Export all three for subsequent steps.
          {
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_ROOT=$NDK_DIR"
            echo "NDKROOT=$NDK_DIR"
          } >> "$GITHUB_ENV"
          echo "Android SDK : $ANDROID_HOME"
          echo "Android NDK : $NDK_DIR"

      - name: Ensure Zen storage server is running
        run: |
          # Zen normally auto-launches scoped to the Cook subprocess's PID and dies the
          # instant Cook exits, which breaks the following Stage step (Connection refused).
          # Run it as a detached, session-independent daemon so it survives across steps
          # and jobs. No-op if a healthy instance is already up.
          if curl -sf http://localhost:8558/health/ready > /dev/null 2>&1; then
            echo "Zen already running and healthy."
          else
            echo "Starting standalone Zen server..."
            setsid nohup "$ENGINE_DIR/Engine/Binaries/Linux/zenserver" \
              --port 8558 \
              --data-dir "$HOME/.config/Epic/UnrealEngine/Common/Zen/Data" \
              --http asio \
              --gc-cache-duration-seconds 1209600 \
              --gc-interval-seconds 21600 \
              --gc-low-diskspace-threshold 2147483648 \
              --cache-bucket-limit-overwrites \
              --quiet \
              > /tmp/zenserver-standalone.log 2>&1 < /dev/null &
            disown
            for i in $(seq 1 30); do
              curl -sf http://localhost:8558/health/ready > /dev/null 2>&1 && break
              sleep 1
            done
            curl -sf http://localhost:8558/health/ready > /dev/null 2>&1 || {
              echo "ERROR: Zen server failed to start"; cat /tmp/zenserver-standalone.log; exit 1
            }
            echo "Zen server started."
          fi

      - name: Build C++ module (Android)
        run: |
          "$ENGINE_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            ${PROJECT_NAME} Android Shipping \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -progress

      - name: Prepare Android signing (from secrets)
        run: |
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            eval "val=\${$s}"
            test -n "$val" || { echo "ERROR: secret $s is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          done

          mkdir -p "$GITHUB_WORKSPACE/Build/Android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/Build/Android/release.keystore"

          # UE layers Config/Android/AndroidEngine.ini on top of DefaultEngine.ini for
          # Android builds. Generated here from secrets, gitignored, never committed.
          mkdir -p "$GITHUB_WORKSPACE/Config/Android"
          cat > "$GITHUB_WORKSPACE/Config/Android/AndroidEngine.ini" << EOF
          [/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
          KeyStore=release.keystore
          KeyAlias=$ANDROID_KEY_ALIAS
          KeyStorePassword=$ANDROID_KEYSTORE_PASSWORD
          KeyPassword=$ANDROID_KEY_PASSWORD
          ; Play requires versionCode to strictly increase on every upload.
          StoreVersion=$GITHUB_RUN_NUMBER
          EOF
          echo "Signing config + StoreVersion=$GITHUB_RUN_NUMBER prepared."
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Package for Android (APK + AAB)
        run: |
          # Scripts are staged separately from cooked content. Without this targeted
          # cleanup UAT can combine current scripts with an hours-old IoStore container,
          # making runtime-loaded assets appear missing despite valid force-cook rules.
          rm -rf "$GITHUB_WORKSPACE"/Saved/Cooked/Android* \
                 "$GITHUB_WORKSPACE"/Saved/StagedBuilds/Android* \
                 "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          "$ENGINE_DIR/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -noP4 \
            -platform=Android \
            -cookflavor=Multi \
            -clientconfig=Development \
            -cook -build -stage -pak -package -archive \
            -nozenstore \
            -archivedirectory="$OUTPUT_DIR"

      - name: Collect APK + AAB
        run: |
          APK_DIR="$GITHUB_WORKSPACE/Artifacts/apk"
          AAB_DIR="$GITHUB_WORKSPACE/Artifacts/aab"
          mkdir -p "$APK_DIR" "$AAB_DIR"
          found_apk=0
          found_aab=0
          while IFS= read -r f; do
            echo "Found APK: $f"; cp -f "$f" "$APK_DIR/"; found_apk=1
          done < <(find "$OUTPUT_DIR" "$GITHUB_WORKSPACE/Saved/StagedBuilds/Android" \
                     -name '*.apk' 2>/dev/null)
          while IFS= read -r f; do
            echo "Found AAB: $f"; cp -f "$f" "$AAB_DIR/"; found_aab=1
          done < <(find "$OUTPUT_DIR" "$GITHUB_WORKSPACE/Saved/StagedBuilds/Android" \
                     -name '*.aab' 2>/dev/null)
          if [ "$found_apk" = "0" ]; then
            echo "ERROR: packaging produced no .apk"; exit 1
          fi
          if [ "$found_aab" = "0" ]; then
            echo "WARNING: packaging produced no .aab (bEnableBundle may need adjusting) — Play upload step will be skipped."
          fi
          ls -lh "$APK_DIR" "$AAB_DIR" 2>/dev/null

      # The APK as its own dedicated artifact (for direct sideload installs).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: Artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # The AAB as its own artifact (for Play Console upload).
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: Artifacts/aab/*.aab
          if-no-files-found: warn
          retention-days: 14

      # Full staged build (loose files) kept as a separate artifact.
      - name: Upload staged build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-staged-${{ github.sha }}
          path: Saved/StagedBuilds/Android/
          if-no-files-found: warn
          retention-days: 14

  # ── Play Internal Testing ──────────────────────────────────────────────────
  # Only on main/master: a broken experimental branch shouldn't push a bad
  # build to testers' phones. Play auto-updates the Play Store app on any
  # device that has opted into the internal test — no cable, no manual APK.
  publish-play-internal:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 15

    env:
      PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.angelbeach.beachvolleyball' }}

    steps:
      - name: Checkout (for the upload script)
        uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: aab

      - name: Write service account key
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "ERROR: secret PLAY_SERVICE_ACCOUNT_JSON is not set."
            echo "       Play Console → Setup → API access → service account JSON."
            exit 1
          }
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Install uploader dependencies
        run: pip install --quiet --user google-api-python-client google-auth

      - name: Upload to Play internal testing track
        run: |
          AAB=$(find aab -name '*.aab' | head -1)
          test -n "$AAB" || { echo "ERROR: no .aab downloaded"; exit 1; }
          python3 scripts/upload_play_internal.py \
            --package "$PACKAGE_NAME" \
            --aab "$AAB" \
            --service-account-json "$RUNNER_TEMP/play-service-account.json" \
            --track internal \
            --release-notes "CI build ${{ github.sha }}"

      - name: Clean up service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
