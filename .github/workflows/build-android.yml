name: Build – Android

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, ue5]
    timeout-minutes: 180

    env:
      ENGINE_DIR: ${{ vars.ENGINE_DIR || '/opt/UnrealEngine-Angelscript' }}
      PROJECT_NAME: BeachVolleyball
      OUTPUT_DIR: ${{ github.workspace }}/PackagedBuilds/Android
      # Android SDK/NDK paths — set these as repository variables or override below.
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}
      ANDROID_SDK_ROOT: ${{ vars.ANDROID_HOME || '/opt/android-sdk' }}
      ANDROID_NDK_HOME: ${{ vars.ANDROID_NDK_HOME || '/opt/android-ndk' }}
      # UBT locates the NDK via NDKROOT / NDK_ROOT (not ANDROID_NDK_HOME).
      NDKROOT: ${{ vars.ANDROID_NDK_HOME || '/opt/android-ndk' }}
      NDK_ROOT: ${{ vars.ANDROID_NDK_HOME || '/opt/android-ndk' }}
      ANDROID_NDK_ROOT: ${{ vars.ANDROID_NDK_HOME || '/opt/android-ndk' }}
      JAVA_HOME: ${{ vars.JAVA_HOME || '/usr/lib/jvm/java-17-openjdk-amd64' }}
      # Persistent DDC outside workspace — survives between runs
      UE_DERIEDDATACACHE_ROOT: ${{ vars.ENGINE_DIR || '/opt/UnrealEngine-Angelscript' }}/Engine/DerivedDataCache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Content/Characters/ (Manny mesh/skeleton/anims) is gitignored and provisioned
          # once locally on this runner -- default clean=true runs `git clean -ffdx` and
          # wipes it before every build, leaving the mesh unresolvable at cook time (silent
          # fallback to boxes at runtime, no cook-time error). Keep it across checkouts.
          clean: false

      - name: Verify engine
        run: |
          test -x "$ENGINE_DIR/Engine/Binaries/Linux/UnrealEditor" || {
            echo "ERROR: engine not found at $ENGINE_DIR"
            exit 1
          }
          echo "Engine OK: $ENGINE_DIR"

      - name: Verify Android SDK/NDK
        run: |
          test -d "$ANDROID_HOME" || { echo "ERROR: ANDROID_HOME not found: $ANDROID_HOME"; exit 1; }
          test -d "$ANDROID_NDK_HOME" || { echo "ERROR: ANDROID_NDK_HOME not found: $ANDROID_NDK_HOME"; exit 1; }
          echo "Android SDK : $ANDROID_HOME"
          echo "Android NDK : $ANDROID_NDK_HOME"

      - name: Ensure Zen storage server is running
        run: |
          # Zen normally auto-launches scoped to the Cook subprocess's PID and dies the
          # instant Cook exits, which breaks the following Stage step (Connection refused).
          # Run it as a detached, session-independent daemon so it survives across steps
          # and jobs. No-op if a healthy instance is already up.
          if curl -sf http://localhost:8558/health/ready > /dev/null 2>&1; then
            echo "Zen already running and healthy."
          else
            echo "Starting standalone Zen server..."
            setsid nohup "$ENGINE_DIR/Engine/Binaries/Linux/zenserver" \
              --port 8558 \
              --data-dir "$HOME/.config/Epic/UnrealEngine/Common/Zen/Data" \
              --http asio \
              --gc-cache-duration-seconds 1209600 \
              --gc-interval-seconds 21600 \
              --gc-low-diskspace-threshold 2147483648 \
              --cache-bucket-limit-overwrites \
              --quiet \
              > /tmp/zenserver-standalone.log 2>&1 < /dev/null &
            disown
            for i in $(seq 1 30); do
              curl -sf http://localhost:8558/health/ready > /dev/null 2>&1 && break
              sleep 1
            done
            curl -sf http://localhost:8558/health/ready > /dev/null 2>&1 || {
              echo "ERROR: Zen server failed to start"; cat /tmp/zenserver-standalone.log; exit 1
            }
            echo "Zen server started."
          fi

      - name: Build C++ module (Android)
        run: |
          "$ENGINE_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            ${PROJECT_NAME} Android Shipping \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -progress

      - name: Package for Android (APK)
        run: |
          mkdir -p "$OUTPUT_DIR"
          "$ENGINE_DIR/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/${PROJECT_NAME}.uproject" \
            -noP4 \
            -platform=Android \
            -cookflavor=Multi \
            -clientconfig=Shipping \
            -cook -build -stage -pak -package -archive \
            -iterativecooking \
            -ddc="$UE_DERIEDDATACACHE_ROOT" \
            -archivedirectory="$OUTPUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: PackagedBuilds/Android/
          retention-days: 14
