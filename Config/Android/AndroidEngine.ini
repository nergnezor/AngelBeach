[/Script/Engine.RendererSettings]
; SkyAtmosphere RE-ENABLED on Android (was False since c4b3094).
;
; It was turned off on the strength of an editor warning that mobile
; SkyAtmosphere wants a dedicated sky mesh with an "Is Sky" material. That
; warning is about the sky mesh/reflection path — the atmosphere itself renders
; on mobile — and switching it off left Android with no sky at all: the only
; thing colouring the upper hemisphere was ExponentialHeightFog, which is a
; ground-hugging layer, so device screenshots have a black band across the top
; of frame (measured (13,5,3), and still (17,8,3) after stretching the fog layer
; with FogHeightFalloff, which is why that approach was abandoned).
;
; It also had a second-order cost: with no sky, the sea reflects warm haze
; instead of sky, so the water renders warm cream (151,113,83) rather than blue,
; no matter what its own colour is. Fog cannot be both the sky and the aerial
; perspective.
;
; If this turns out to render badly on device, flip these three back to
; False/False/0 — that is exactly the previous state, and a black sky is what we
; already had, so the downside is bounded.
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True

[SystemSettings]
r.SkyAtmosphere=1
