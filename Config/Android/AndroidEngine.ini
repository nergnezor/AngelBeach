[/Script/Engine.RendererSettings]
; SkyAtmosphere stays OFF on Android. It was disabled in c4b3094 because mobile
; wants a dedicated sky mesh with an "Is Sky" material; that was re-tested by
; turning all three of these on, and the device screenshot showed no sky at all
; — the top of frame measured (7,2,1), still black. The original comment was
; right, so this is back off rather than left on doing nothing.
;
; The consequence is that ExponentialHeightFog (spawned in GameMode.as) is the
; only thing colouring the sky on Android, which is why its height falloff is
; tuned so low there: the fog layer has to be tall enough to BE the sky. A real
; gradient sky needs an authored sky mesh, or a procedural banded dome built the
; same way the net is.
r.SupportSkyAtmosphere=False
r.SupportSkyAtmosphereAffectsHeightFog=False

[SystemSettings]
r.SkyAtmosphere=0
