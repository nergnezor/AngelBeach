[/Script/Engine.RendererSettings]
; WORKING, 2026-09-01, confirmed on a real device (Motorola Razr 50). Two
; prior attempts (c4b3094 and one before this comment) only ever flipped
; these CVars and rebuilt, and saw a black sky (top of frame (7,2,1)) both
; times. Two things were actually wrong, not one:
;
; 1. r.SupportSkyAtmosphere gates a mobile-forward SHADER PERMUTATION, not a
;    runtime toggle. Neither prior attempt is on record as having forced a
;    real re-cook, so the permutation may never have existed in the package.
; 2. Even with the CVar genuinely on, ASkyAtmosphere renders NOTHING by
;    itself — UE's own on-screen warning says so verbatim: "[SkyAtmosphere]
;    component needs a mesh with a material tagged as IsSky and using the
;    SkyAtmosphere nodes to visualize the Atmosphere." This was the missing
;    piece both prior attempts never had a way to see (no device, no visible
;    warning). Environment.as::BuildSky now applies the engine's own
;    /Engine/EngineSky/SkyAtmosphere/SkyAtmosphere_MaterialSkyDome to the
;    mobile sky dome mesh instead of authoring one from scratch — same
;    material stock BP_Sky_Sphere uses. It also needs force-cooking (see
;    DefaultGame.ini) since it's loaded by string path.
;
; Device result: a real Rayleigh-scattering gradient (deep navy zenith to
; blue-grey horizon), no banding, no black-body regression on player skin.
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True

[SystemSettings]
r.SkyAtmosphere=1
; Stock engine default for Android is 0 (BaseAndroidEngine.ini) — clouds are
; opted out of on mobile by default upstream, same shape of gate as
; r.SupportSkyAtmosphere above. Confirmed cost is acceptable on a Mali-G615
; MC2 device (Motorola Razr 50): no VK_ERROR_DEVICE_LOST, no dropped VISTA
; shots, at the same 6.5km layer altitude desktop already uses.
r.VolumetricCloud.Support=1
