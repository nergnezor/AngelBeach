[/Script/Engine.RendererSettings]
; SkyAtmosphere on mobile requires a dedicated sky mesh whose material has
; "Is Sky" enabled. The desktop atmosphere is retained in DefaultEngine.ini;
; Android uses the stable directional-light/fog fallback until that authored
; mobile sky asset exists.
r.SupportSkyAtmosphere=False
r.SupportSkyAtmosphereAffectsHeightFog=False

[SystemSettings]
r.SkyAtmosphere=0
