[URL]
GameName=BeachVolleyball

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=True
; TSR — highest-quality temporal anti-aliasing
r.AntiAliasingMethod=4
; Keep Lumen functional when Vulkan hardware RT is unavailable at editor startup.
r.GenerateMeshDistanceFields=True

; Lumen GI + reflections with hardware ray tracing (RTX 3060 Ti)
r.SupportHardwareRayTracing=True
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.Reflections.HardwareRayTracing=True
r.Lumen.Reflections.Allow=1
r.RayTracing.Shadows=True
; Limit RT pool size to avoid Vulkan OOM on 8GB VRAM
r.RayTracing.MaxBatchedPrimitives=4096
; The Shader Binding Table's per-record stride defaults to 4096 bytes — the
; real GPU minimum (shaderGroupHandleSize/alignment) is ~32B on RTX 30-series;
; 4096 is a conservative generic ceiling, not a requirement. With ~1024 hit
; group records in this scene the SBT hit exactly 1024*4096=4MB and exhausted
; the small DEVICE_LOCAL|HOST_VISIBLE Vulkan heap on RHICommitShaderBindingTable
; (crashed opening ABP_VolleyballPlayer and on PIE). 128B keeps generous
; headroom above the real minimum while shrinking the same table to ~128KB.
r.Vulkan.RayTracing.MaxShaderGroupStride=128
r.Lumen.ScreenProbeGather.RadianceCache.NumProbes=256
; Virtual shadow maps
r.Shadow.Virtual.Enable=1
; Parallel shader compilation — leave 2 cores free
r.ShaderCompiler.NumParallelLocalJobs=14

