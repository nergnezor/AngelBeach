GameName=BeachVolleyball

[/Script/Engine.RendererSettings]
; Auto exposure is ON and its numbers are EV100, not legacy luminance. The
; project used to disable it and then override the min/max back on in the
; PostProcessVolume, which meant the two halves disagreed about both whether
; exposure adapted and what unit its bounds were in. ExtendDefaultLuminanceRange
; is what makes AutoExposureMin/MaxBrightness and the bias all read as EV100,
; so the values in GameMode.as mean what a photographer would expect.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=True
; TSR — highest-quality temporal anti-aliasing
r.AntiAliasingMethod=4
; Keep Lumen functional when Vulkan hardware RT is unavailable at editor startup.
r.GenerateMeshDistanceFields=True

; Lumen GI + reflections with hardware ray tracing (RTX 3060 Ti)
r.SupportHardwareRayTracing=True
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.Reflections.HardwareRayTracing=True
r.Lumen.Reflections.Allow=1
r.RayTracing.Shadows=True
; Limit RT pool size to avoid Vulkan OOM on 8GB VRAM
r.RayTracing.MaxBatchedPrimitives=4096
; The Shader Binding Table's per-record stride defaults to 4096 bytes — the
; real GPU minimum (shaderGroupHandleSize/alignment) is ~32B on RTX 30-series;
; 4096 is a conservative generic ceiling, not a requirement. With ~1024 hit
; group records in this scene the SBT hit exactly 1024*4096=4MB and exhausted
; the small DEVICE_LOCAL|HOST_VISIBLE Vulkan heap on RHICommitShaderBindingTable
; (crashed opening ABP_VolleyballPlayer and on PIE).
;
; 128B was the first fix and it OVERSHOT: the table fits, but a hit-group
; record whose local root parameters exceed 128B then writes past the end of
; its own slot, and every -game run died on frame 0 with
;   VulkanRayTracing.cpp:987  "SBT record write request is out of bounds"
; before a single pixel was drawn. Hardware RT — and with it Lumen GI, Lumen
; reflections and RT shadows, i.e. the entire desktop reference look — was
; unusable for as long as that value stood. 512B is the smallest tested value
; that renders: the records fit, and the table is still only ~512KB against the
; 4MB that exhausted the heap. If a future material pushes a record past 512B
; the same assert comes back — raise this, do not disable r.RayTracing.
r.Vulkan.RayTracing.MaxShaderGroupStride=512
r.Lumen.ScreenProbeGather.RadianceCache.NumProbes=256
; Virtual shadow maps
r.Shadow.Virtual.Enable=1
; Parallel shader compilation — leave 2 cores free
r.ShaderCompiler.NumParallelLocalJobs=14

