[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Bundle all cooked game data INSIDE the APK instead of a separate .obb
; expansion file. Without this the APK expects an OBB (or a Google Play
; store key to download one); sideloaded/CI APKs have neither, so the game
; boots to "No OBB found / No Google Play Store Key" and loads no content.
bPackageDataInsideApk=True
; Don't gate startup on OBB verification (there is no OBB now).
bDisableVerifyOBBOnStartUp=True

; Play Console app identity — must match the app created in Play Console.
PackageName=com.angelbeach.beachvolleyball
VersionDisplayName=1.0
; versionCode: Play requires this to strictly increase on every upload.
; CI overrides this per-build via the generated Config/Android/AndroidEngine.ini
; (see build-android.yml) using the GitHub Actions run number; this is just
; the local/default fallback for non-CI packaging.
StoreVersion=1

; Google Play requires new apps to ship as an Android App Bundle (.aab),
; not a raw .apk.
bEnableBundle=True

; Signing keystore. The actual KeyStore/KeyAlias/*Password values are NOT
; committed here — CI writes them at build time into
; Config/Android/AndroidEngine.ini (gitignored) from GitHub Secrets, which
; UE layers on top of this file for Android builds. For local packaging,
; create that same file yourself (see scripts/setup-runner.sh) — never
; commit a keystore or its passwords to this repo.

