[/Script/UnrealEd.ProjectPackagingSettings]
; Use classic loose-file cooking instead of the Zen Store. Zen requires a
; running local ZenServer (port 8558); in headless/CI packaging it is often
; unreachable and cook fails with "Connection refused" reading the oplog.
bUseZenStore=False
; Player.as loads both assets by string at runtime, so Unreal's reference
; gatherer cannot discover them while cooking an Android APK. Force-cook the
; Manny mesh/material/skeleton hierarchy and the volleyball Animation Blueprint
; to prevent the runtime fallback to brown placeholder boxes.
;
; /Game/Characters/... is gitignored (see .gitignore, LFS budget) and no
; longer exists in any checkout — these two entries are dead weight until/
; unless that content comes back, but harmless to leave (an always-cook
; directory with nothing in it is a silent no-op, confirmed in a cook log:
; zero mentions of Mannequins, not even a warning). The /MoverExamples entry
; below is what actually matters now: it's the only Manny mesh source
; consistently present (ships with the engine's MoverExamples plugin), so
; SetupMesh()'s fallback LoadObject depends on it being force-cooked.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequin")
+DirectoriesToAlwaysCook=(Path="/MoverExamples/Characters/Mannequins/Meshes")

; NOTE: [AlwaysCookMaps] below (pre-existing) was never confirmed to actually
; force anything — a cook log grepped clean for "Manny"/"Mannequin" with this
; section present and unchanged, no error, no attempt, nothing. It was
; presumably never caught because /Game/Characters/... still had real content
; via the primary DirectoriesToAlwaysCook entries above until the LFS purge,
; masking that this section was doing nothing. Left in place since it's
; unproven-harmless rather than proven-harmful, but DirectoriesToAlwaysCook
; above is now the mechanism this project actually depends on — verify with
; a fresh cook log (grep for SKM_Manny_Simple under LogCook) before trusting
; entries here again.
[AlwaysCookMaps]
+Map=/Game/Characters/Mannequins/Meshes/SKM_Manny_Simple
+Map=/Game/Characters/Mannequin/ABP_VolleyballPlayer
+Map=/MoverExamples/Characters/Mannequins/Meshes/SKM_Manny_Simple
; ApplyTeamMaterial() in VolleyballPlayer.as loads this by string at runtime as
; a mobile-safe stand-in for M_Mannequin (which renders flat/untextured on
; Android — see git log). Force-cooking it here is likely belt-and-suspenders
; (engine C++ hard-references its own default material regardless), but every
; other LoadObject-by-string target in this file needed an explicit line, so
; don't assume this one is different without testing.
+Map=/Engine/EngineMaterials/DefaultMaterial

; ApplySolidColorMaterial() (a private method on both ACourt and AEnvironment)
; loads this by string at runtime for every procedural mesh (sand, net, court
; lines, posts, water), and SpawnFallbackBox() in
; VolleyballPlayer.as gets it indirectly as /Engine/BasicShapes/Cube's material.
; It replaces the /Engine/EngineDebugMaterials/* materials that used to be listed
; here: force-cooking those was NOT enough to make them work, because editor
; debug materials are not usable material assets in a cooked Shipping build —
; every procedural mesh silently rendered with the engine's fallback material
; instead (checkerboard sand, no blue water). See ACourt::ApplySolidColorMaterial.
+Map=/Engine/BasicShapes/BasicShapeMaterial
+Map=/Engine/BasicShapes/Cube
